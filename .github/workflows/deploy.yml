name: Deploy Blazor WASM to Azure Static Web Apps 

on:
  push:
    branches: [ master ]
  pull_request:
    types: [ opened, synchronize, reopened ]

# --------------------------------------------------------------------
# Existing job – unchanged
# --------------------------------------------------------------------
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore
        run: dotnet restore BlazorHero.CleanArchitecture.sln

      - name: Publish Blazor WASM
        run: |
          dotnet publish src/Client/Client.csproj \
            -c Release \
            /p:UseAppHost=false \
            /p:DotNetJsVersion=6.0 \
            -o output/client

      - name: Move wwwroot to root
        run: |
          mv output/client/wwwroot/* output/client/ || true
          rmdir output/client/wwwroot || true
          
      - name: Verify index.html
        run: |
          ls -la output/client/index.html
    
      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "upload"
          app_location: "output/client"

  # --------------------------------------------------------------------
  # NEW JOB – API deployment (does **not** affect the client job)
  # --------------------------------------------------------------------
  deploy-api:
    runs-on: ubuntu-latest
    needs: build_and_deploy          # optional – ensures API deploys after client (remove if you want parallel)
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 6.0
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Restore API
        run: dotnet restore src/Server/Server.csproj   # <-- adjust path/name if your API project differs

      - name: Publish API
        run: |
          dotnet publish src/Server/Server.csproj \
            -c Release \
            -o output/api

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: blazor-api-ielts
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE_API }}
          package: ./output/api
